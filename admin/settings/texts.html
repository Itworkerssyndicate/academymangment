  <link rel="stylesheet" href="../assets/css/layout.css">
  
  <style>
    /* ============ TEXTS MANAGEMENT ============ */
    
    .page-header-admin {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .page-header-info h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 4px;
    }
    
    .page-header-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }
    
    .page-header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    /* ============ LAYOUT ============ */
    .texts-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      align-items: start;
    }
    
    /* ============ SIDEBAR GROUPS ============ */
    .texts-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }
    
    .texts-sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }
    
    .texts-sidebar-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    
    .texts-sidebar-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px 4px;
    }
    
    .texts-sidebar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    
    .texts-sidebar-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    
    .texts-sidebar-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }
    
    .texts-sidebar-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    
    .texts-sidebar-count {
      margin-right: auto;
      font-size: 10px;
      padding: 1px 6px;
      background: var(--bg);
      border-radius: 999px;
      color: var(--text-muted);
      font-family: 'Courier New', monospace;
    }
    
    .texts-sidebar-btn.active .texts-sidebar-count {
      background: var(--primary);
      color: var(--primary-text);
    }
    
    /* ============ MAIN PANEL ============ */
    .texts-main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    
    .texts-main-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg);
    }
    
    .texts-main-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .texts-main-title svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }
    
    .texts-main-search {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
      position: relative;
    }
    
    .texts-main-search input {
      width: 100%;
      padding: 7px 32px 7px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: all 0.15s;
    }
    
    .texts-main-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    
    .texts-main-search svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }
    
    /* ============ TEXT FIELDS ============ */
    .texts-fields {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .text-field {
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: all 0.15s;
    }
    
    .text-field:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    
    .text-field.modified {
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.03);
    }
    
    .text-field-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    
    .text-field-label-wrap {
      flex: 1;
      min-width: 0;
    }
    
    .text-field-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .text-field-key {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: var(--primary);
      padding: 1px 6px;
      background: var(--primary-soft);
      border-radius: 4px;
      letter-spacing: 0.3px;
    }
    
    .text-field-desc {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    
    .text-field-reset {
      padding: 3px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    
    .text-field-reset:hover {
      border-color: var(--warning);
      color: var(--warning);
      background: var(--warning-soft);
    }
    
    .text-field-reset:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .text-field-reset svg {
      width: 10px;
      height: 10px;
    }
    
    .text-field-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      transition: all 0.15s;
      resize: vertical;
    }
    
    .text-field-input:focus {
      border-color: var(--primary);
      background: var(--surface-elevated);
    }
    
    textarea.text-field-input {
      min-height: 60px;
    }
    
    .text-field-default {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
      font-family: 'Courier New', monospace;
      padding: 4px 8px;
      background: var(--surface);
      border-radius: 6px;
      border: 1px dashed var(--border);
      display: none;
    }
    
    .text-field.modified .text-field-default {
      display: block;
    }
    
    /* ============ EMPTY STATE ============ */
    .texts-empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .texts-empty svg {
      width: 48px;
      height: 48px;
      opacity: 0.3;
      margin-bottom: 12px;
    }
    
    /* ============ BOTTOM BAR ============ */
    .texts-save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 50;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
      flex-wrap: wrap;
    }
    
    .texts-save-bar.show {
      display: flex;
    }
    
    .texts-save-bar-info {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .texts-save-bar-info strong {
      color: var(--warning);
      font-weight: 700;
    }
    
    .texts-save-bar-actions {
      display: flex;
      gap: 10px;
    }
    
    /* ============ LOADER ============ */
    .admin-loader {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    
    .admin-loader.show { display: block; }
    
    .admin-loader-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    .admin-loader-text {
      color: var(--text-muted);
      font-size: 14px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .texts-layout {
        grid-template-columns: 1fr;
      }
      
      .texts-sidebar {
        position: static;
        max-height: none;
      }
      
      .texts-sidebar-group {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      .texts-sidebar-title {
        width: 100%;
        padding: 4px 4px 2px;
      }
      
      .texts-sidebar-btn {
        width: auto;
        padding: 6px 12px;
        font-size: 11px;
      }
      
      .texts-sidebar-btn.active {
        box-shadow: none;
      }
    }
    
    @media (max-width: 640px) {
      .texts-main-header {
        flex-direction: column;
        align-items: stretch;
      }
      
      .texts-main-search {
        max-width: none;
      }
      
      .texts-fields {
        padding: 14px;
      }
      
      .text-field-header {
        flex-direction: column;
        align-items: stretch;
      }
      
      .text-field-reset {
        align-self: flex-start;
      }
      
      .texts-save-bar {
        padding: 10px 16px;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      // ============================================
      // الحالة
      // ============================================
      var state = {
        currentUser: null,
        activeGroup: 'public_nav',
        savedTexts: {},           // من DB
        editedTexts: {},          // التعديلات الحالية
        originalTexts: {},        // نسخة للتراجع
        searchTerm: '',
        saving: false,
        loading: false,
        initialized: false
      };

      // ============================================
      // Helpers
      // ============================================
      function $(id) { return document.getElementById(id); }
      function setText(id, t) { var el = $(id); if (el) el.textContent = t; }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      function toast(msg, type) {
        if (window.Utils && window.Utils.showToast) window.Utils.showToast(msg, type || 'info');
        else if (type === 'error') alert(msg);
      }

      function logDebug() {
        if (window.ITWS_CONFIG && window.ITWS_CONFIG.DEBUG) {
          console.log.apply(console, ['[AdminTexts]'].concat(Array.prototype.slice.call(arguments)));
        }
      }

      function hasPermission(perm) {
        if (window.Permissions && window.Permissions.can) return window.Permissions.can(perm);
        if (window.AuthGuard && window.AuthGuard.getUser) {
          var u = window.AuthGuard.getUser();
          return u && u.role === 'super_admin';
        }
        return false;
      }

      // ============================================
      // Load Texts from Supabase
      // ============================================
      function loadTexts() {
        if (!window.sb) return Promise.resolve({});
        return window.sb
          .from('settings')
          .select('value')
          .eq('key', 'texts')
          .maybeSingle()
          .then(function (res) {
            if (res.error || !res.data || !res.data.value) return {};
            return res.data.value || {};
          })
          .catch(function () { return {}; });
      }

      // ============================================
      // Get effective text (edited > saved > default)
      // ============================================
      function getTextValue(fieldKey) {
        if (Object.prototype.hasOwnProperty.call(state.editedTexts, fieldKey)) {
          return state.editedTexts[fieldKey];
        }
        if (Object.prototype.hasOwnProperty.call(state.savedTexts, fieldKey)) {
          return state.savedTexts[fieldKey];
        }
        // default
        var def = findFieldDefault(fieldKey);
        return def || '';
      }

      function findFieldDefault(fieldKey) {
        for (var i = 0; i < TEXT_GROUPS.length; i++) {
          var g = TEXT_GROUPS[i];
          for (var j = 0; j < g.fields.length; j++) {
            if (g.fields[j].key === fieldKey) return g.fields[j].default;
          }
        }
        return '';
      }

      function findFieldMeta(fieldKey) {
        for (var i = 0; i < TEXT_GROUPS.length; i++) {
          var g = TEXT_GROUPS[i];
          for (var j = 0; j < g.fields.length; j++) {
            if (g.fields[j].key === fieldKey) return { group: g, field: g.fields[j] };
          }
        }
        return null;
      }

      // ============================================
      // Modified count
      // ============================================
      function getModifiedCount() {
        return Object.keys(state.editedTexts).length;
      }

      function updateSaveBar() {
        var bar = $('saveBar');
        var count = getModifiedCount();
        setText('modifiedCount', count);
        if (bar) {
          bar.classList.toggle('show', count > 0);
        }
      }

      // ============================================
      // Render Sidebar
      // ============================================
      function renderSidebar() {
        var sidebar = $('textsSidebar');
        if (!sidebar) return;

        sidebar.innerHTML = TEXT_GROUPS.map(function (g) {
          var isActive = g.key === state.activeGroup;
          return '' +
            '<button class="texts-sidebar-btn' + (isActive ? ' active' : '') + '" data-group="' + escapeHtml(g.key) + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="' + escapeHtml(g.icon) + '"></path>' +
              '</svg>' +
              '<span>' + escapeHtml(g.label) + '</span>' +
              '<span class="texts-sidebar-count">' + g.fields.length + '</span>' +
            '</button>';
        }).join('');

        // Bind
        sidebar.querySelectorAll('[data-group]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.activeGroup = btn.getAttribute('data-group');
            state.searchTerm = '';
            var searchInput = $('textsSearch');
            if (searchInput) searchInput.value = '';
            renderSidebar();
            renderFields();
          });
        });
      }

      // ============================================
      // Render Fields
      // ============================================
      function renderFields() {
        var group = TEXT_GROUPS.find(function (g) { return g.key === state.activeGroup; });
        if (!group) return;

        setText('currentGroupTitle', group.label);

        var container = $('textsFields');
        var emptyEl = $('textsEmpty');
        if (!container) return;

        // Filter by search
        var fields = group.fields;
        if (state.searchTerm) {
          var term = state.searchTerm.toLowerCase();
          fields = fields.filter(function (f) {
            return f.label.toLowerCase().indexOf(term) !== -1 ||
                   f.key.toLowerCase().indexOf(term) !== -1 ||
                   (f.default && f.default.toLowerCase().indexOf(term) !== -1);
          });
        }

        if (fields.length === 0) {
          container.innerHTML = '';
          if (emptyEl) emptyEl.style.display = 'block';
          return;
        }

        if (emptyEl) emptyEl.style.display = 'none';

        container.innerHTML = fields.map(renderField).join('');

        // Bind events
        container.querySelectorAll('[data-text-key]').forEach(function (input) {
          input.addEventListener('input', function () {
            var key = this.getAttribute('data-text-key');
            var value = this.value;
            var defaultValue = findFieldDefault(key);

            if (value === defaultValue && !state.savedTexts[key]) {
              // رجع للقيمة الافتراضية
              delete state.editedTexts[key];
            } else if (state.savedTexts[key] === value) {
              // رجع للقيمة المحفوظة
              delete state.editedTexts[key];
            } else {
              state.editedTexts[key] = value;
            }

            // تحديث الـ UI
            var fieldWrap = this.closest('.text-field');
            if (fieldWrap) {
              var isModified = Object.prototype.hasOwnProperty.call(state.editedTexts, key);
              fieldWrap.classList.toggle('modified', isModified);
            }
            var resetBtn = fieldWrap ? fieldWrap.querySelector('[data-reset]') : null;
            if (resetBtn) resetBtn.disabled = !Object.prototype.hasOwnProperty.call(state.editedTexts, key);

            updateSaveBar();
          });
        });

        // Bind reset buttons
        container.querySelectorAll('[data-reset]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var key = btn.getAttribute('data-reset');
            delete state.editedTexts[key];
            renderFields();
            updateSaveBar();
          });
        });
      }

      function renderField(field) {
        var value = getTextValue(field.key);
        var defaultValue = field.default;
        var isModified = Object.prototype.hasOwnProperty.call(state.editedTexts, field.key);

        var inputHtml;
        if (field.type === 'textarea') {
          inputHtml = '<textarea class="text-field-input" data-text-key="' + escapeHtml(field.key) + '" rows="3">' + escapeHtml(value) + '</textarea>';
        } else {
          inputHtml = '<input type="text" class="text-field-input" data-text-key="' + escapeHtml(field.key) + '" value="' + escapeHtml(value) + '">';
        }

        return '' +
          '<div class="text-field' + (isModified ? ' modified' : '') + '">' +
            '<div class="text-field-header">' +
              '<div class="text-field-label-wrap">' +
                '<div class="text-field-label">' +
                  escapeHtml(field.label) +
                  '<span class="text-field-key">' + escapeHtml(field.key) + '</span>' +
                '</div>' +
                '<div class="text-field-desc">' + escapeHtml(field.desc) + '</div>' +
              '</div>' +
              '<button type="button" class="text-field-reset" data-reset="' + escapeHtml(field.key) + '"' + (isModified ? '' : ' disabled') + '>' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<polyline points="1 4 1 10 7 10"></polyline>' +
                  '<path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>' +
                '</svg>' +
                'استعادة' +
              '</button>' +
            '</div>' +
            inputHtml +
            '<div class="text-field-default">القيمة الافتراضية: ' + escapeHtml(defaultValue) + '</div>' +
          '</div>';
      }

      // ============================================
      // Save
      // ============================================
      function saveAll() {
        if (state.saving) return;
        if (getModifiedCount() === 0) {
          toast('لا توجد تعديلات للحفظ', 'info');
          return;
        }

        if (!hasPermission('settings.edit')) {
          toast('غير مصرح لك بتعديل النصوص', 'error');
          return;
        }

        if (!window.sb) {
          toast('تعذر الاتصال بالخادم', 'error');
          return;
        }

        state.saving = true;

        var saveBtn = $('saveAllBtn');
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.dataset._origHtml = saveBtn.innerHTML;
          saveBtn.innerHTML = '<span>جاري الحفظ...</span>';
        }

        // دمج التعديلات مع القيم المحفوظة
        var merged = Object.assign({}, state.savedTexts, state.editedTexts);

        window.sb
          .from('settings')
          .upsert({ key: 'texts', value: merged }, { onConflict: 'key' })
          .then(function (res) {
            if (res.error) throw new Error(res.error.message);

            state.savedTexts = JSON.parse(JSON.stringify(merged));
            state.editedTexts = {};

            toast('تم حفظ النصوص بنجاح', 'success');
            logDebug('Texts saved:', Object.keys(merged).length, 'entries');

            // Log activity
            logActivity('update_texts', 'تحديث نصوص المنصة', {
              count: Object.keys(state.editedTexts).length
            });

            // Refresh UI
            renderFields();
            updateSaveBar();

            // حدّث الـ AppSettings (لو عنده نصوص)
            if (window.AppSettings && window.AppSettings.reload) {
              window.AppSettings.reload();
            }
          })
          .catch(function (err) {
            toast('فشل الحفظ: ' + err.message, 'error');
            logDebug('Save error:', err.message);
          })
          .finally(function () {
            state.saving = false;
            if (saveBtn) {
              saveBtn.disabled = false;
              if (saveBtn.dataset._origHtml) {
                saveBtn.innerHTML = saveBtn.dataset._origHtml;
                delete saveBtn.dataset._origHtml;
              }
            }
          });
      }

      // ============================================
      // Discard
      // ============================================
      function discardChanges() {
        if (getModifiedCount() === 0) return;

        if (!window.Modal || !window.Modal.confirm) {
          if (!confirm('تجاهل كل التعديلات غير المحفوظة؟')) return;
          state.editedTexts = {};
          renderFields();
          updateSaveBar();
          return;
        }

        window.Modal.confirm({
          title: 'تجاهل التعديلات',
          message: 'سيتم فقدان كل التعديلات غير المحفوظة. متأكد؟',
          confirmText: 'تجاهل',
          cancelText: 'إلغاء',
          icon: 'warning',
          danger: true
        }).then(function (confirmed) {
          if (confirmed) {
            state.editedTexts = {};
            renderFields();
            updateSaveBar();
            toast('تم تجاهل التعديلات', 'info');
          }
        });
      }

      // ============================================
      // Log Activity
      // ============================================
      function logActivity(type, description, details) {
        if (!window.sb || !state.currentUser) return;
        window.sb.from('activities').insert({
          user_id: state.currentUser.id,
          user_name: state.currentUser.full_name,
          user_role: state.currentUser.role,
          action_type: type,
          description: description,
          details: details || {}
        }).catch(function () {});
      }

      // ============================================
      // Bind Events
      // ============================================
      function bindEvents() {
        var searchInput = $('textsSearch');
        if (searchInput) {
          var timer = null;
          searchInput.addEventListener('input', function () {
            clearTimeout(timer);
            var val = this.value;
            timer = setTimeout(function () {
              state.searchTerm = val.trim();
              renderFields();
            }, 200);
          });
        }

        var saveBtn = $('saveAllBtn');
        if (saveBtn) saveBtn.addEventListener('click', saveAll);

        var discardBtn = $('discardBtn');
        if (discardBtn) discardBtn.addEventListener('click', discardChanges);

        // Warn before leaving with unsaved changes
        window.addEventListener('beforeunload', function (e) {
          if (getModifiedCount() > 0) {
            var msg = 'لديك تعديلات غير محفوظة — هل تريد المغادرة؟';
            e.returnValue = msg;
            return msg;
          }
        });
      }

      // ============================================
      // Init
      // ============================================
      function init() {
        if (state.initialized) return;
        state.initialized = true;

        if (!hasPermission('settings.view')) {
          toast('غير مصرح لك بالوصول للنصوص', 'error');
          setTimeout(function () {
            window.location.href = window.resolveUrl ? window.resolveUrl('admin/index.html') : 'index.html';
          }, 1500);
          return;
        }

        if (window.AuthGuard && window.AuthGuard.getUser) {
          state.currentUser = window.AuthGuard.getUser();
        }

        var loader = $('adminLoader');
        if (loader) loader.classList.add('show');

        waitForSupabase(function () {
          loadTexts().then(function (savedTexts) {
            state.savedTexts = savedTexts || {};

            if (loader) loader.classList.remove('show');
            var layout = $('textsLayout');
            if (layout) layout.style.display = 'grid';

            renderSidebar();
            renderFields();
            bindEvents();
            updateSaveBar();

            logDebug('Texts initialized. Saved:', Object.keys(state.savedTexts).length);
          });
        });
      }

      function waitForSupabase(cb) {
        if (window.sb) { cb(); return; }
        var w = 0;
        var i = setInterval(function () {
          w += 100;
          if (window.sb || w >= 3000) {
            clearInterval(i);
            if (window.sb) cb();
          }
        }, 100);
      }

      window.AdminTexts = {
        initialized: true,
        init: init,
        getState: function () { return state; },
        getText: function (key) { return getTextValue(key); },
        groups: TEXT_GROUPS
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
