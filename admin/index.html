  <style>
    /* ============ DASHBOARD SPECIFIC ============ */
    
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card-dash {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    
    .stat-card-dash::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .stat-card-dash:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    
    .stat-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    
    .stat-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .stat-card-icon svg {
      width: 22px;
      height: 22px;
    }
    
    .stat-card-icon.success {
      background: var(--success-soft);
      color: var(--success);
    }
    
    .stat-card-icon.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }
    
    .stat-card-icon.info {
      background: var(--info-soft);
      color: var(--info);
    }
    
    .stat-card-change {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
    }
    
    .stat-card-change.down {
      background: var(--error-soft);
      color: var(--error);
    }
    
    .stat-card-change.neutral {
      background: var(--surface-hover);
      color: var(--text-muted);
    }
    
    .stat-card-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
      font-variant-numeric: tabular-nums;
    }
    
    .stat-card-value .online-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      margin-left: 8px;
      vertical-align: middle;
      animation: pulse-dot 2s ease-in-out infinite;
      box-shadow: 0 0 0 3px var(--success-soft);
    }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    
    .stat-card-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      position: relative;
      z-index: 1;
    }
    
    .stat-card-sub {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }
    
    .stat-card-sub-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .stat-card-sub-item .num {
      font-weight: 700;
      color: var(--text);
    }
    
    .stat-card-sub-item .num.success { color: var(--success); }
    .stat-card-sub-item .num.warning { color: var(--warning); }
    .stat-card-sub-item .num.error { color: var(--error); }
    
    /* ============ MAIN GRID ============ */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    
    /* ============ ACTIVITIES PANEL ============ */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }
    
    .panel-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }
    
    .panel-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: gap 0.2s;
    }
    
    .panel-link:hover {
      gap: 8px;
      text-decoration: none;
    }
    
    .panel-link svg {
      width: 12px;
      height: 12px;
    }
    
    .panel-body {
      padding: 8px 0;
      max-height: 500px;
      overflow-y: auto;
    }
    
    /* ============ ACTIVITY ITEM ============ */
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-light);
      transition: background 0.15s;
    }
    
    .activity-item:last-child {
      border-bottom: none;
    }
    
    .activity-item:hover {
      background: var(--surface-hover);
    }
    
    .activity-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    
    .activity-content {
      flex: 1;
      min-width: 0;
    }
    
    .activity-title {
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1.4;
    }
    
    .activity-title strong {
      color: var(--primary);
      font-weight: 700;
    }
    
    .activity-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .activity-type-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .activity-type-badge.login { background: var(--info-soft); color: var(--info); }
    .activity-type-badge.logout { background: var(--error-soft); color: var(--error); }
    .activity-type-badge.create { background: var(--success-soft); color: var(--success); }
    .activity-type-badge.update { background: var(--warning-soft); color: var(--warning); }
    .activity-type-badge.delete { background: var(--error-soft); color: var(--error); }
    .activity-type-badge.default { background: var(--surface-hover); color: var(--text-muted); }
    
    /* ============ QUICK ACTIONS ============ */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px 20px;
    }
    
    .quick-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      text-align: center;
      transition: all 0.2s;
    }
    
    .quick-action:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--text);
      transform: translateY(-2px);
      text-decoration: none;
    }
    
    .quick-action-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .quick-action-icon svg {
      width: 18px;
      height: 18px;
    }
    
    .quick-action-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    
    /* ============ EMPTY ============ */
    .empty-panel {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .empty-panel svg {
      width: 40px;
      height: 40px;
      color: var(--text-muted);
      opacity: 0.3;
      margin-bottom: 12px;
    }
    
    /* ============ LOADING SKELETON ============ */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 0%, var(--surface-hover) 50%, var(--surface) 100%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s ease-in-out infinite;
      border-radius: 6px;
    }
    
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .skeleton-stat {
      height: 100px;
    }
    
    .skeleton-line {
      height: 14px;
      margin-bottom: 8px;
    }
    
    .skeleton-line.w-60 { width: 60%; }
    .skeleton-line.w-40 { width: 40%; }
    
    /* ============ RESPONSIVE ============ */
    @media (max-width: 1024px) {
      .dashboard-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 640px) {
      .dashboard-stats {
        grid-template-columns: 1fr;
      }
      
      .stat-card-value {
        font-size: 26px;
      }
      
      .quick-actions {
        grid-template-columns: 1fr;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
