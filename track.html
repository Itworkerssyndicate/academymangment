<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <title>متابعة طلب الاعتماد</title>
  <meta name="description" content="متابعة حالة طلب اعتماد الأكاديمية">
  <meta name="theme-color" content="#0A0E14">
  <meta name="color-scheme" content="dark light">
  
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/logo.svg">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- ═══ Core Scripts (Head) ═══ -->
  <script src="assets/js/settings-defaults.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/themes-data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app-settings.js"></script>
  <script src="assets/js/labels.js"></script>
  
  <!-- ═══ Core CSS ═══ -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  
  <!-- ═══ Track-Specific CSS ═══ -->
  <style>
    /* ============================================================
       TRACK PAGE — Request Header + Timeline + Banners + SLA
       (Hero + Search + Loading + Error from pages.css)
       ============================================================ */
    
    body {
      background: var(--bg);
      margin: 0;
    }
    
    /* ═══ RESULT VISIBILITY (works with class OR hidden) ═══ */
    #trackResult { display: none; }
    #trackResult.show,
    #trackResult:not([hidden]) {
      display: block;
      animation: page-result-fadein 0.4s ease;
    }
    
    #trackLoader,
    #trackError { display: none; }
    #trackLoader.show,
    #trackLoader:not([hidden]) { display: flex; }
    #trackError.show,
    #trackError:not([hidden]) { display: flex; }
    
    /* ═══ REQUEST HEADER CARD ═══ */
    
    .request-header-card {
      background: linear-gradient(135deg, var(--surface), var(--surface-elevated));
      border: 1px solid var(--border);
      border-radius: var(--radius-3xl, 20px);
      padding: clamp(20px, 3vw, 28px);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    
    .request-header-card::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline-end: 0;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    
    .request-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    
    .request-title-box {
      flex: 1;
      min-width: 200px;
    }
    
    .request-number {
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-sm, 13px);
      font-weight: var(--fw-bold, 700);
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    
    .request-academy-name {
      font-size: clamp(18px, 3vw, 24px);
      font-weight: var(--fw-extrabold, 800);
      color: var(--text);
      line-height: 1.3;
      margin: 0;
      word-break: break-word;
    }
    
    /* ═══ STATUS BADGE ═══ */
    
    .request-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: var(--fs-sm, 13px);
      font-weight: var(--fw-bold, 700);
      flex-shrink: 0;
      line-height: 1.4;
    }
    
    .request-status-badge.submitted {
      background: var(--info-soft);
      color: var(--info);
    }
    .request-status-badge.documents_review {
      background: var(--warning-soft);
      color: var(--warning);
    }
    .request-status-badge.site_visit {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .request-status-badge.committee_review {
      background: var(--info-soft);
      color: var(--info);
    }
    .request-status-badge.final_approval {
      background: var(--success-soft);
      color: var(--success);
    }
    .request-status-badge.approved {
      background: var(--success-soft);
      color: var(--success);
    }
    .request-status-badge.rejected {
      background: var(--error-soft);
      color: var(--error);
    }
    
    .request-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: statusPulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    
    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* ═══ META GRID ═══ */
    
    .request-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr));
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    
    .request-meta-item {
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, 10px);
    }
    
    .request-meta-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      font-weight: var(--fw-semibold, 600);
    }
    
    .request-meta-value {
      font-size: var(--fs-md, 14px);
      font-weight: var(--fw-semibold, 600);
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }
    
    .request-meta-value.mono {
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      font-size: var(--fs-sm, 13px);
    }
    
    .request-meta-value.warning {
      color: var(--warning);
    }
    
    /* ═══ SLA BADGE ═══ */
    
    .request-sla-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: var(--fw-bold, 700);
      margin-top: 6px;
      line-height: 1.4;
    }
    
    .request-sla-badge.on-time {
      background: var(--success-soft);
      color: var(--success);
    }
    
    .request-sla-badge.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }
    
    .request-sla-badge.overdue {
      background: var(--error-soft);
      color: var(--error);
    }
    
    /* ═══ TIMELINE ═══ */
    
    .timeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-3xl, 20px);
      padding: clamp(20px, 3vw, 32px) clamp(16px, 2.5vw, 28px);
      margin-bottom: 24px;
    }
    
    .timeline-title {
      font-size: var(--fs-lg, 17px);
      font-weight: var(--fw-bold, 700);
      color: var(--text);
      margin: 0 0 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .timeline-title svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
    }
    
    .timeline {
      position: relative;
      padding-inline-start: 40px;
    }
    
    .timeline::before {
      content: "";
      position: absolute;
      inset-inline-start: 15px;
      top: 20px;
      bottom: 20px;
      width: 2px;
      background: var(--border);
    }
    
    .timeline-item {
      position: relative;
      padding-bottom: 32px;
    }
    
    .timeline-item:last-child {
      padding-bottom: 0;
    }
    
    .timeline-item::before {
      content: "";
      position: absolute;
      inset-inline-start: -33px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--surface);
      background: var(--border);
      z-index: 2;
      box-sizing: content-box;
    }
    
    .timeline-item.completed::before {
      background: var(--success);
      box-shadow: 0 0 0 4px var(--success-soft);
    }
    
    .timeline-item.current::before {
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
      animation: timelinePulse 1.8s ease-in-out infinite;
    }
    
    .timeline-item.rejected::before {
      background: var(--error);
      box-shadow: 0 0 0 4px var(--error-soft);
    }
    
    @keyframes timelinePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    
    .timeline-stage {
      font-size: var(--fs-md, 15px);
      font-weight: var(--fw-bold, 700);
      color: var(--text);
    }
    
    .timeline-item.completed .timeline-stage { color: var(--success); }
    .timeline-item.current .timeline-stage { color: var(--primary); }
    .timeline-item.rejected .timeline-stage { color: var(--error); }
    
    .timeline-date {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    
    .timeline-desc {
      font-size: var(--fs-sm, 13px);
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0;
    }
    
    .timeline-notes {
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--bg);
      border-inline-start: 3px solid var(--primary);
      border-radius: var(--radius-md, 8px);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .timeline-notes.rejected {
      border-inline-start-color: var(--error);
      background: var(--error-soft);
      color: var(--error);
    }
    
    /* ═══ INFO CARDS ═══ */
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .info-card {
      padding: clamp(16px, 2.5vw, 20px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl, 14px);
    }
    
    .info-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .info-card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md, 8px);
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .info-card-icon svg {
      width: 16px;
      height: 16px;
    }
    
    .info-card-title {
      font-size: var(--fs-sm, 13px);
      font-weight: var(--fw-bold, 700);
      color: var(--text);
      margin: 0;
    }
    
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 12px;
    }
    
    .info-item-label {
      color: var(--text-muted);
      flex-shrink: 0;
    }
    
    .info-item-value {
      color: var(--text);
      font-weight: var(--fw-semibold, 600);
      text-align: end;
      word-break: break-word;
    }
    
    .info-item-value.mono {
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      font-size: 11px;
    }
    
    /* ═══ DOCUMENTS ═══ */
    
    .documents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
      gap: 12px;
    }
    
    .document-item {
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, 10px);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .document-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md, 8px);
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .document-icon svg {
      width: 16px;
      height: 16px;
    }
    
    .document-info {
      flex: 1;
      min-width: 0;
    }
    
    .document-name {
      font-size: 12px;
      font-weight: var(--fw-semibold, 600);
      color: var(--text);
      margin-bottom: 2px;
      word-break: break-word;
    }
    
    .document-status {
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .document-status.uploaded {
      color: var(--success);
    }
    
    .document-status.missing {
      color: var(--error);
    }
    
    .document-action {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm, 6px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    
    .document-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    
    .document-action svg {
      width: 12px;
      height: 12px;
    }
    
    /* ═══ APPROVED / REJECTED BANNERS ═══ */
    
    .approved-banner,
    .rejected-banner {
      padding: clamp(18px, 3vw, 24px);
      border: 2px solid;
      border-radius: var(--radius-2xl, 16px);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .approved-banner {
      background: linear-gradient(135deg, var(--success-soft), transparent);
      border-color: var(--success);
    }
    
    .rejected-banner {
      background: linear-gradient(135deg, var(--error-soft), transparent);
      border-color: var(--error);
      align-items: flex-start;
    }
    
    .approved-banner-icon,
    .rejected-banner-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .approved-banner-icon {
      background: var(--success);
    }
    
    .rejected-banner-icon {
      background: var(--error);
    }
    
    .approved-banner-icon svg,
    .rejected-banner-icon svg {
      width: 28px;
      height: 28px;
    }
    
    .approved-banner-content,
    .rejected-banner-content {
      flex: 1;
      min-width: 200px;
    }
    
    .approved-banner-title {
      font-size: var(--fs-lg, 18px);
      font-weight: var(--fw-extrabold, 800);
      color: var(--success);
      margin: 0 0 4px;
      line-height: 1.3;
    }
    
    .rejected-banner-title {
      font-size: var(--fs-lg, 18px);
      font-weight: var(--fw-extrabold, 800);
      color: var(--error);
      margin: 0 0 6px;
      line-height: 1.3;
    }
    
    .approved-banner-text,
    .rejected-banner-text {
      font-size: var(--fs-sm, 13px);
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0;
    }
    
    /* ═══ NOSCRIPT ═══ */
    .noscript-banner {
      padding: 16px 20px;
      background: var(--error-soft, #fef2f2);
      color: var(--error, #991b1b);
      border-bottom: 2px solid var(--error, #991b1b);
      text-align: center;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
    }
    
    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 640px) {
      .timeline {
        padding-inline-start: 32px;
      }
      
      .timeline::before {
        inset-inline-start: 11px;
      }
      
      .timeline-item::before {
        inset-inline-start: -25px;
        width: 14px;
        height: 14px;
      }
      
      .request-header-top {
        flex-direction: column;
        align-items: stretch;
      }
      
      .request-status-badge {
        align-self: flex-start;
      }
      
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .request-status-dot,
      .timeline-item.current::before {
        animation: none !important;
      }
    }
    
    @media print {
      .page-hero,
      .page-search-card,
      .page-main-inner > .page-loading,
      #headerContainer,
      .theme-fab-wrap {
        display: none !important;
      }
      
      .request-header-card,
      .timeline-card,
      .info-card,
      .approved-banner,
      .rejected-banner {
        box-shadow: none !important;
        page-break-inside: avoid;
      }
      
      .request-header-card::before {
        display: none !important;
      }
    }
  </style>
</head>
<body data-page="track">

  <noscript>
    <div class="noscript-banner">
      هذه الصفحة تحتاج تفعيل JavaScript في المتصفح للعمل بشكل صحيح.
    </div>
  </noscript>

  <div class="page-wrapper">

    <div id="headerContainer"></div>

    <!-- ═══ HERO ═══ -->
    <section class="page-hero">
      <div class="page-hero-inner">
        <div class="page-hero-badge" data-dynamic="track_badge">متابعة الطلب</div>
        <h1 class="page-hero-title" data-dynamic="track_title">
          تتبع <span class="page-hero-title-accent">طلب الاعتماد</span>
        </h1>
        <p class="page-hero-subtitle" data-dynamic="track_subtitle">
          أدخل رقم طلب الاعتماد لمتابعة حالته والمراحل التي تم اجتيازها
        </p>
      </div>
    </section>

    <!-- ═══ MAIN ═══ -->
    <main class="page-main">
      <div class="page-main-inner">

        <!-- SEARCH -->
        <div class="page-search-card" id="searchCard">
          <div class="page-search-label" data-dynamic="track_search_label">رقم طلب الاعتماد</div>

          <form class="page-search-form" id="trackForm" onsubmit="return false;">
            <input
              type="text"
              class="page-search-input"
              id="requestNumberInput"
              placeholder="REQ-2026-XXXX"
              data-dynamic-placeholder="accreditation.request_code_pattern"
              autocomplete="off"
              autocapitalize="characters"
              autocorrect="off"
              spellcheck="false"
              maxlength="30"
              inputmode="text"
              dir="ltr"
              aria-label="رقم طلب الاعتماد"
              required
            >
            <button type="submit" class="page-search-btn" id="trackBtn"
                    data-dynamic="track_btn">متابعة</button>
          </form>

          <div class="page-search-hint" data-dynamic="track_hint">
            <span data-icon="info"></span>
            <span>الرقم يبدأ بـ REQ- ويظهر بعد تقديم طلب الاعتماد</span>
          </div>
        </div>

        <!-- LOADING -->
        <div class="page-loading" id="trackLoader" role="status" aria-live="polite" aria-busy="true">
          <div class="page-loading-spinner" aria-hidden="true"></div>
          <div class="page-loading-text" data-label="track.loading">جاري البحث عن الطلب...</div>
        </div>

        <!-- ERROR -->
        <div class="page-error" id="trackError" role="alert" aria-live="assertive">
          <div class="page-error-icon" aria-hidden="true">
            <span data-icon="x-circle"></span>
          </div>
          <h2 class="page-error-title" id="errorTitle">لم يتم العثور على الطلب</h2>
          <p class="page-error-text" id="errorText">
            تأكد من رقم الطلب أو تواصل مع النقابة
          </p>
        </div>

        <!-- RESULT -->
        <div id="trackResult" role="region" aria-live="polite" aria-label="نتيجة متابعة الطلب"></div>

      </div>
    </main>

    <!-- ═══ FOOTER ═══ -->
    <footer class="home-footer">
      <div class="home-footer-inner">
        <div class="home-footer-bottom" style="padding-top: 24px; border-top: none;">
          <span data-home="footer-copyright"></span>
          <span data-home="footer-president-wrap" hidden>
            <span data-home="footer-president-label"></span>
            <span class="home-footer-president" data-home="footer-president-name"></span>
          </span>
        </div>
      </div>
    </footer>

  </div>

  <!-- ═══ SCRIPTS (Body end) ═══ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app-title.js"></script>
  <script src="assets/js/realtime.js"></script>
  <script src="assets/js/ui/header.js"></script>
  <script src="assets/js/ui/modal.js"></script>
  <script src="assets/js/ui/toast.js"></script>
  <script src="assets/js/ui/dropdown.js"></script>

  <script src="assets/js/pages/track.js"></script>

</body>
</html>
