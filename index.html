<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ============ Meta ============ -->
  <title>جاري التحميل... | نقابة تكنولوجيا المعلومات</title>
  <meta name="description" content="النظام الرسمي للتحقق من صحة الشهادات التدريبية - نقابة تكنولوجيا المعلومات والبرمجيات">
  <meta name="theme-color" content="#0A1628">
  
  <!-- ============ Open Graph ============ -->
  <meta property="og:title" content="نقابة تكنولوجيا المعلومات والبرمجيات">
  <meta property="og:description" content="النظام الرسمي للتحقق من صحة الشهادات التدريبية">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_EG">
  
  <!-- ============ Fonts ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- ============ Theme Bootstrap (BEFORE CSS) ============ -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/themes-data.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <!-- ============ CSS ============ -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  
  <!-- ============ Splash Custom Styles ============ -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
    }
    
    .splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    
    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .splash-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201, 168, 76, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201, 168, 76, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      opacity: 0.6;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    }
    
    .splash-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-soft, rgba(201, 168, 76, 0.15)), transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      animation: splashGlowPulse 4s ease-in-out infinite;
    }
    
    @keyframes splashGlowPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    
    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
      max-width: 500px;
      animation: splashContentIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes splashContentIn {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      color: var(--primary-text, #fff);
      font-family: var(--font, 'Cairo', sans-serif);
      box-shadow:
        0 0 0 12px var(--primary-soft, rgba(201, 168, 76, 0.1)),
        0 20px 60px var(--primary-soft, rgba(201, 168, 76, 0.3));
      margin-bottom: 28px;
      overflow: hidden;
      position: relative;
      animation: splashLogoFloat 3s ease-in-out infinite;
    }
    
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 14px;
    }
    
    @keyframes splashLogoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    .splash-title {
      font-family: var(--font, 'Cairo', sans-serif);
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    
    .splash-subtitle {
      font-family: var(--font, 'Cairo', sans-serif);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0 0 32px 0;
      letter-spacing: 0.3px;
    }
    
    .splash-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin-bottom: 32px;
      border-radius: 2px;
    }
    
    .splash-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    
    .splash-loader-bar {
      width: 220px;
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    
    .splash-loader-bar::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, var(--accent), var(--primary), var(--accent));
      border-radius: 999px;
      animation: splashLoaderSlide 1.4s ease-in-out infinite;
    }
    
    @keyframes splashLoaderSlide {
      0% { right: 100%; width: 40%; }
      50% { right: 30%; width: 40%; }
      100% { right: -40%; width: 40%; }
    }
    
    .splash-loader-text {
      font-family: var(--font, 'Cairo', sans-serif);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    
    .splash-footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font, 'Cairo', sans-serif);
      font-size: 11px;
      color: var(--text-muted);
      z-index: 2;
      opacity: 0.7;
    }
    
    .splash-footer strong {
      color: var(--primary);
      font-weight: 600;
    }
    
    /* إخفاء الـ body المؤقت */
    body {
      visibility: hidden;
    }
    
    body.is-ready {
      visibility: visible;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .splash-logo {
        width: 88px;
        height: 88px;
        font-size: 34px;
      }
      
      .splash-title {
        font-size: 20px;
      }
      
      .splash-subtitle {
        font-size: 13px;
      }
      
      .splash-loader-bar {
        width: 180px;
      }
    }
    
    /* Reduce Motion */
    @media (prefers-reduced-motion: reduce) {
      .splash-glow,
      .splash-logo,
      .splash-loader-bar::after {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- ============ Splash Screen ============ -->
  <div class="splash-screen" id="splashScreen" role="status" aria-live="polite">
    
    <!-- Background effects -->
    <div class="splash-bg-grid"></div>
    <div class="splash-glow"></div>
    
    <!-- Main content -->
    <div class="splash-content">
      
      <!-- Logo -->
      <div class="splash-logo" id="splashLogo" aria-hidden="true">ن.ت</div>
      
      <!-- Title -->
      <h1 class="splash-title" id="splashTitle">نقابة تكنولوجيا المعلومات والبرمجيات</h1>
      
      <!-- Subtitle -->
      <p class="splash-subtitle" id="splashSubtitle">لجنة التحول الرقمي والتدريب</p>
      
      <!-- Divider -->
      <div class="splash-divider"></div>
      
      <!-- Loader -->
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
        <div class="splash-loader-text" id="splashLoaderText">جاري التحميل...</div>
      </div>
      
    </div>
    
    <!-- Footer -->
    <div class="splash-footer">
      <div>
        © 2026 <strong id="splashFooterName">نقابة تكنولوجيا المعلومات</strong>
      </div>
      <div style="margin-top:4px;">
        <span id="splashFooterPresident">النقيب العام: المحاسب / محمود جميل</span>
      </div>
    </div>
    
  </div>

  <!-- ============ Hidden content (بس عشان theme.js يشتغل) ============ -->
  <div style="display:none;" id="appRoot"></div>

  <!-- ============ Scripts ============ -->
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Core -->
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  
  <!-- Dynamic Title & Favicon -->
  <script src="assets/js/app-title.js"></script>
  
  <!-- ============ Redirect Logic ============ -->
  <script>
    (function () {
      'use strict';
      
      var MIN_SPLASH_TIME = 1200;   // الحد الأدنى للعرض (1.2 ثانية)
      var MAX_SPLASH_TIME = 5000;   // الحد الأقصى (5 ثوانٍ) — بعدها نروح home.html
      var startTime = Date.now();
      var hasRedirected = false;
      
      var ROUTES = (window.ITWS_CONFIG && window.ITWS_CONFIG.ROUTES) || {
        HOME: '/home.html',
        LOGIN: '/login.html',
        ADMIN: '/admin/index.html'
      };
      
      // ============ 1. تحديث المحتوى من الإعدادات ============
      function updateSplashContent(settings) {
        if (!settings) return;
        
        var unionName = settings.union_name || 'نقابة تكنولوجيا المعلومات والبرمجيات';
        var committeeName = settings.committee_name || 'لجنة التحول الرقمي والتدريب';
        var presidentName = settings.president_name || 'المحاسب / محمود جميل';
        var logoUrl = settings.logo_url || null;
        
        var titleEl = document.getElementById('splashTitle');
        var subtitleEl = document.getElementById('splashSubtitle');
        var footerNameEl = document.getElementById('splashFooterName');
        var footerPresidentEl = document.getElementById('splashFooterPresident');
        var logoEl = document.getElementById('splashLogo');
        
        if (titleEl) titleEl.textContent = unionName;
        if (subtitleEl) subtitleEl.textContent = committeeName;
        if (footerNameEl) footerNameEl.textContent = unionName;
        if (footerPresidentEl) footerPresidentEl.textContent = 'النقيب العام: ' + presidentName;
        
        if (logoUrl && logoEl) {
          logoEl.innerHTML = '<img src="' + logoUrl + '" alt="' + unionName + '">';
        }
      }
      
      // ============ 2. تحديث نص التحميل ============
      var loaderSteps = [
        'جاري التحميل...',
        'جاري التحقق من الجلسة...',
        'جاري تجهيز المنصة...',
        'على وشك الدخول...'
      ];
      var loaderStepIndex = 0;
      var loaderInterval = null;
      
      function startLoaderAnimation() {
        var textEl = document.getElementById('splashLoaderText');
        if (!textEl) return;
        
        loaderInterval = setInterval(function () {
          loaderStepIndex = (loaderStepIndex + 1) % loaderSteps.length;
          textEl.textContent = loaderSteps[loaderStepIndex];
        }, 900);
      }
      
      function stopLoaderAnimation() {
        if (loaderInterval) {
          clearInterval(loaderInterval);
          loaderInterval = null;
        }
      }
      
      // ============ 3. تحديد وجهة التوجيه ============
      function determineRoute(user) {
        if (!user) {
          // زائر → home.html
          return ROUTES.HOME;
        }
        
        // مستخدم مسجل — حسب الدور
        var role = user.role || 'user';
        
        if (role === 'super_admin' || role === 'admin' || role === 'committee_manager') {
          return ROUTES.ADMIN;
        }
        
        // user عادي → home
        return ROUTES.HOME;
      }
      
      // ============ 4. التوجيه بعد التأخير ============
      function redirectWithDelay(url) {
        if (hasRedirected) return;
        hasRedirected = true;
        
        stopLoaderAnimation();
        
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
        
        setTimeout(function () {
          var splash = document.getElementById('splashScreen');
          if (splash) {
            splash.classList.add('fade-out');
          }
          
          setTimeout(function () {
            window.location.href = url;
          }, 400);
        }, remaining);
      }
      
      // ============ 5. جلب المستخدم الحالي ============
      function getCurrentUser() {
        if (window.AuthGuard && window.AuthGuard.getCurrentUser) {
          return window.AuthGuard.getCurrentUser().catch(function () {
            return null;
          });
        }
        
        if (window.sb) {
          return window.sb.auth.getUser()
            .then(function (res) {
              if (!res || !res.data || !res.data.user) return null;
              var u = res.data.user;
              return window.sb
                .from('profiles')
                .select('role, is_active')
                .eq('id', u.id)
                .maybeSingle()
                .then(function (r) {
                  if (!r.data || r.data.is_active === false) return null;
                  return {
                    id: u.id,
                    email: u.email,
                    role: r.data.role || 'user'
                  };
                });
            })
            .catch(function () { return null; });
        }
        
        return Promise.resolve(null);
      }
      
      // ============ 6. جلب الإعدادات ============
      function loadSettings() {
        if (!window.sb) return Promise.resolve(null);
        return window.sb
          .from('settings')
          .select('value')
          .eq('key', 'general')
          .maybeSingle()
          .then(function (r) {
            return r.data && r.data.value ? r.data.value : null;
          })
          .catch(function () { return null; });
      }
      
      // ============ 7. الإقلاع ============
      function boot() {
        // نظهر الـ body
        document.body.classList.add('is-ready');
        
        // نبدأ الأنيميشن
        startLoaderAnimation();
        
        // نجيب الإعدادات والمستخدم معاً
        Promise.all([loadSettings(), getCurrentUser()])
          .then(function (results) {
            var settings = results[0];
            var user = results[1];
            
            if (settings) {
              updateSplashContent(settings);
            }
            
            var destination = determineRoute(user);
            
            if (window.ITWS_CONFIG && window.ITWS_CONFIG.DEBUG) {
              console.log('[Index] User:', user ? user.email + ' (' + user.role + ')' : 'guest');
              console.log('[Index] Destination:', destination);
            }
            
            redirectWithDelay(destination);
          })
          .catch(function (err) {
            console.warn('[Index] Boot error:', err);
            // نروح home على أي حال
            redirectWithDelay(ROUTES.HOME);
          });
        
        // أمان: لو حصلت مشكلة، نروح home بعد MAX_SPLASH_TIME
        setTimeout(function () {
          if (!hasRedirected) {
            console.warn('[Index] Max splash time reached, redirecting...');
            redirectWithDelay(ROUTES.HOME);
          }
        }, MAX_SPLASH_TIME);
      }
      
      // ============ 8. التشغيل ============
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
      
    })();
  </script>

</body>
</html>
